<style>
:root{
  --bg:#06161B; --bg2:#0A2028; --card:#0E2A33; --chip:#14363F;
  --ink:#E9F3F1; --sub:#8FAAA8; --line:#1B404A;
  --accent:#FFB03A; --accent2:#FF7A45; --onAccent:#1A0E00; --accentDk:#FF7A45;
  --navy:#14363F; --teal:#4FD1A5; --green:#4FD1A5; --amber:#FFB03A; --danger:#FF6B6B;
  --glow:255,176,58; --okBg:rgba(79,209,165,.14); --warnBg:rgba(255,176,58,.14); --badBg:rgba(255,107,107,.14);
}
[data-line="magenta"]{--bg:#16090E;--bg2:#210E16;--card:#2A121C;--chip:#371825;--ink:#FFEDF2;--sub:#C295A5;--line:#43202F;--accent:#FF6B8B;--accent2:#FFAE7B;--onAccent:#1A050A;--accentDk:#FFAE7B;--navy:#371825;--teal:#4FD1A5;--green:#4FD1A5;--amber:#FFAE7B;--danger:#FF5C7A;--glow:255,107,139;--okBg:rgba(79,209,165,.14);--warnBg:rgba(255,174,123,.15);--badBg:rgba(255,92,122,.15);}
[data-line="yellow"]{--bg:#12110B;--bg2:#1B1910;--card:#221F14;--chip:#2E2A1B;--ink:#FBF6E4;--sub:#B0A47C;--line:#3A3520;--accent:#F5C518;--accent2:#FF9E3D;--onAccent:#17140A;--accentDk:#FF9E3D;--navy:#2E2A1B;--teal:#5BD6A8;--green:#5BD6A8;--amber:#F5C518;--danger:#FF7A6B;--glow:245,197,24;--okBg:rgba(91,214,168,.13);--warnBg:rgba(245,197,24,.15);--badBg:rgba(255,122,107,.15);}
[data-line="aqua"]{--bg:#051613;--bg2:#08211D;--card:#0B2B25;--chip:#103830;--ink:#E2FBF3;--sub:#88B5A7;--line:#16463B;--accent:#34D9A0;--accent2:#57C8F0;--onAccent:#021410;--accentDk:#57C8F0;--navy:#103830;--teal:#34D9A0;--green:#34D9A0;--amber:#F5C518;--danger:#FF6B6B;--glow:52,217,160;--okBg:rgba(52,217,160,.14);--warnBg:rgba(245,197,24,.14);--badBg:rgba(255,107,107,.14);}
[data-line="violet"]{--bg:#0A0918;--bg2:#121026;--card:#171432;--chip:#1F1B42;--ink:#EDEAFF;--sub:#9E96C6;--line:#2B2554;--accent:#8B8CFF;--accent2:#56D5FF;--onAccent:#07061A;--accentDk:#56D5FF;--navy:#1F1B42;--teal:#5BD6A8;--green:#5BD6A8;--amber:#FFC46B;--danger:#FF6B8B;--glow:139,140,255;--okBg:rgba(91,214,168,.14);--warnBg:rgba(255,196,107,.14);--badBg:rgba(255,107,139,.15);}
[data-line="day"]{--bg:#F6F4EF;--bg2:#FFFFFF;--card:#FFFFFF;--chip:#EDEAE2;--ink:#12140F;--sub:#5B6154;--line:#DDD9CE;--accent:#166534;--accent2:#B45309;--onAccent:#FFFFFF;--accentDk:#B45309;--navy:#12140F;--teal:#166534;--green:#166534;--amber:#B45309;--danger:#B91C1C;--glow:22,101,52;--okBg:rgba(22,101,52,.10);--warnBg:rgba(180,83,9,.11);--badBg:rgba(185,28,28,.09);}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;
  transition:background .45s ease,color .45s ease;-webkit-font-smoothing:antialiased;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;transition:background .45s ease;
  background:radial-gradient(70vw 46vh at 82% -6%,rgba(var(--glow),.20),transparent 62%),
             radial-gradient(60vw 40vh at 0% 42%,rgba(var(--glow),.10),transparent 60%);}
#wrap{max-width:480px;margin:0 auto;padding-bottom:104px;min-height:100vh;position:relative;z-index:1;}
@media(min-width:900px){
  body{background:var(--bg);}
  #wrap{margin:22px auto 30px;border:1px solid var(--line);border-radius:30px;background:color-mix(in srgb,var(--bg2) 72%,transparent);
        backdrop-filter:blur(16px);box-shadow:0 40px 100px rgba(0,0,0,.42);min-height:calc(100vh - 52px);overflow:hidden;}
  [data-line="day"] #wrap{box-shadow:0 30px 70px rgba(20,40,80,.13);}
  .nav .navin{border-radius:0 0 30px 30px;}
}
h1{font-family:Archivo,sans-serif;font-size:21px;font-weight:800;font-stretch:114%;margin:0;line-height:1.05;letter-spacing:-.025em;}
.px{padding-left:16px;padding-right:16px;} .row{display:flex;}
.muted{color:var(--sub);} .sm{font-size:12px;} .xs{font-size:11px;} .b{font-weight:700;}
.mono,.tbox span,.hero .big{font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{text-decoration:none;color:inherit;}
input,textarea{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:15px;outline:none;font-family:inherit;transition:border-color .2s,box-shadow .2s,background .2s;}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--glow),.16);background:var(--card);}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent);}
textarea{resize:none;}
::placeholder{color:var(--sub);opacity:.75;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
label.f{font-size:11px;font-weight:700;color:var(--sub);display:block;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;} .field{margin-bottom:15px;}
.header{display:flex;align-items:center;gap:11px;padding:22px 16px 13px;}
.logo{background:linear-gradient(140deg,var(--accent),var(--accent2));border-radius:14px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 8px 26px rgba(var(--glow),.34);}
.banner{margin:0 16px 10px;border-radius:13px;padding:9px 13px;font-size:12px;display:flex;gap:6px;align-items:flex-start;border:1px solid transparent;}
.chipbar{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;} .chipbar::-webkit-scrollbar{display:none;}
.datechip{padding:7px 15px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--sub);transition:.25s;}
.datechip.on{background:var(--accent);color:var(--onAccent);border-color:var(--accent);box-shadow:0 6px 20px rgba(var(--glow),.32);}
.hero{margin:0 16px 13px;background:linear-gradient(155deg,var(--chip),var(--card));border:1px solid var(--line);color:var(--ink);border-radius:22px;padding:18px;position:relative;overflow:hidden;}
.hero:before{content:"";position:absolute;top:-70px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--glow),.30),transparent);}
.hero .lbl{font-variant-numeric:tabular-nums;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);position:relative;}
.hero .big{font-size:36px;font-weight:700;margin:4px 0 0;letter-spacing:-.03em;position:relative;
  background:linear-gradient(96deg,var(--accent),var(--accent2),var(--accent));background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 7s linear infinite;}
@keyframes shift{to{background-position:260% 0}}
.hero .stats{display:flex;gap:16px;margin-top:12px;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;position:relative;}
.cta{margin:0 16px 14px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px;font-weight:700;color:var(--onAccent);background:var(--accent);
  box-shadow:0 10px 30px rgba(var(--glow),.30);transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .25s;}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(var(--glow),.42);}
.cta:active{transform:scale(.985);}
.livebar{margin:0 16px 12px;border-radius:13px;padding:10px 13px;font-size:12px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);}
.tl{padding:0 16px;} .node{display:flex;gap:12px;}
.rail{width:40px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.dot{border-radius:999px;height:34px;width:34px;display:flex;align-items:center;justify-content:center;color:var(--onAccent);font-weight:800;font-size:14px;flex-shrink:0;font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 4px rgba(var(--glow),.14);}
.line{width:3px;background:var(--line);flex:1;margin-top:3px;border-radius:3px;}
.seg{display:flex;align-items:center;} .seg .rail .line{margin:3px 0;flex:none;height:22px;}
.segtxt{font-size:11.5px;color:var(--sub);padding:4px 0;font-variant-numeric:tabular-nums;}
.buf{display:flex;align-items:center;} .bufpill{font-size:11px;font-weight:600;padding:6px 10px;border-radius:10px;margin:2px 0;display:flex;gap:5px;align-items:center;}
.card{flex:1;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;margin-bottom:4px;transition:border-color .25s,transform .25s;}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.card.done{opacity:.72;} .cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
.iconbtn{padding:8px;border-radius:11px;background:var(--chip);flex-shrink:0;font-size:13px;line-height:1;border:1px solid var(--line);transition:.2s;}
.iconbtn:hover{border-color:var(--accent);color:var(--accent);}
.acts{display:flex;gap:8px;margin-top:12px;} .act{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;padding:10px 0;border-radius:11px;transition:transform .16s;}
.act:active{transform:scale(.96);}
.latebox{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;font-size:12px;font-weight:600;padding:8px 10px;border-radius:11px;background:var(--badBg);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 32%,transparent);}
.donebtn{width:100%;margin-top:9px;font-size:12px;font-weight:700;padding:10px 0;border-radius:11px;background:var(--chip);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s;}
.donebtn:hover{border-color:var(--accent);color:var(--accent);}
.undobtn{width:100%;margin-top:9px;font-size:12px;font-weight:700;padding:10px 0;border-radius:11px;background:var(--chip);color:var(--sub);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;}
.grouphdr{font-variant-numeric:tabular-nums;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--sub);margin:20px 0 9px;display:flex;gap:6px;align-items:center;}
.prow{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:13px;margin-bottom:9px;display:flex;align-items:center;gap:12px;transition:border-color .25s,transform .25s;}
.prow:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateX(2px);}
.tbox{border-radius:13px;height:46px;width:46px;background:var(--chip);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:var(--sub);}
.durwrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.dur-btn{padding:8px 15px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--sub);transition:.22s;}
.dur-btn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));}
.dur-btn.active{background:var(--accent);color:var(--onAccent);border-color:var(--accent);box-shadow:0 6px 18px rgba(var(--glow),.28);}
.btnbig{width:100%;border-radius:14px;padding:14px;font-weight:700;color:var(--onAccent);background:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:9px;
  box-shadow:0 8px 26px rgba(var(--glow),.26);transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .25s;}
.btnbig:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(var(--glow),.38);}
.btnbig:active{transform:scale(.985);}
.empty{text-align:center;padding:62px 24px;} .empty .eico{margin:0 auto 18px;border-radius:20px;height:68px;width:68px;background:var(--chip);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:27px;}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;} .navin{max-width:480px;margin:0 auto;display:flex;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);}
.navb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0 13px;font-size:10px;font-weight:700;color:var(--sub);transition:color .22s;position:relative;} .navb.on{color:var(--accent);}
.navb.on:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--accent);}
.navico{font-size:20px;line-height:1;transition:transform .25s;} .navb.on .navico{transform:translateY(-2px) scale(1.08);}
.plus{background:linear-gradient(140deg,var(--accent),var(--accent2));color:var(--onAccent);border-radius:999px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 20px rgba(var(--glow),.4);}
.green{background:var(--okBg);color:var(--green);border-color:color-mix(in srgb,var(--green) 30%,transparent);} .warn{background:var(--warnBg);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 30%,transparent);}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.tile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;transition:border-color .25s;}
.tile:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.tile .k{font-size:11px;color:var(--sub);letter-spacing:.04em;text-transform:uppercase;font-weight:700;}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:5px;line-height:1.05;}
.tile .s{font-size:11.5px;color:var(--sub);margin-top:3px;}
.tile.hot{border-color:var(--accent);}
.tile.hot .v{color:var(--accent);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.searchbox{margin-top:6px;} .searchres{display:block;width:100%;text-align:left;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-size:13px;margin-bottom:6px;transition:.2s;}
.searchres:hover{border-color:var(--accent);}
.locslot{border:1px dashed var(--line);border-radius:16px;padding:12px;margin-bottom:11px;}
.radio{display:flex;gap:9px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card);transition:.25s;}
.radio.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card));box-shadow:0 0 0 3px rgba(var(--glow),.12);}
.dotr{width:19px;height:19px;border-radius:999px;border:2px solid var(--line);flex-shrink:0;margin-top:2px;transition:.25s;} .radio.on .dotr{border-color:var(--accent);background:var(--accent);}
.langrow{display:flex;justify-content:flex-end;padding:12px 16px 0;}
.lineswatch{width:15px;height:15px;border-radius:50%;display:inline-block;margin-right:2px;vertical-align:-2px;}
#wrap>*{animation:fadeUp .38s cubic-bezier(.2,.8,.3,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.tl .node,.tl .seg,.tl .buf{animation:fadeUp .42s cubic-bezier(.2,.8,.3,1) both;}
.prow{animation:fadeUp .34s cubic-bezier(.2,.8,.3,1) both;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

function parseLocation(text){if(!text)return{lat:null,lng:null,address:"",raw:""};var raw=text.trim();var res=[/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/[@?&](?:q|ll|destination|query)=\s*(-?\d{1,2}\.\d+)\s*(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i,/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,/(-?\d{1,2}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})/];for(var i=0;i<res.length;i++){var m=raw.match(res[i]);if(m){var lat=parseFloat(m[1]),lng=parseFloat(m[2]);if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return{lat:lat,lng:lng,address:"",raw:raw};}}return{lat:null,lng:null,address:raw,raw:raw};}

  clearTimeout(CUST);

    fetch(S.settings.apiUrl,{method:"POST",body:JSON.stringify(
      {action:"save-customers",key:ownerKey(),customers:S.customers})}).catch(function(){});

window.pullCustomers=function(){
  if(!S.settings.apiUrl||!ownerKey()){alert(t("keyMissing"));return;}
  if(!confirm(t("alPullAsk")))return;
  var u=S.settings.apiUrl;
  fetch(u+(u.indexOf("?")>=0?"&":"?")+"customers=1&key="+encodeURIComponent(ownerKey()))
    .then(function(r){return r.json();})
    .then(function(res){
      if(res&&res.error==="locked"){alert(t("alLocked"));return;}
      var list=(res&&res.customers)||[];
      if(!list.length){alert(t("alPullEmpty"));return;}
      S.customers=list;save();render();alert(t("alPulled")+list.length);})
    .catch(function(){alert(t("alBookingsFail"));});};

    name:c.name||"",phone:c.phone||"",email:c.email||"",amount:Number(c.amount)||0,
    bank:c.bank||"",due:c.due||"",card:c.card||"",place:c.address||"",

function inr(n){n=Math.round(Number(n)||0);var neg=n<0;n=Math.abs(n);
  var s=String(n),l3=s.slice(-3),rest=s.slice(0,-3);
  if(rest)l3=","+l3;
  return (neg?"-":"")+"\u20B9"+rest.replace(/\B(?=(\d{2})+(?!\d))/g,",")+l3;}
function allVisits(){var out=[];S.customers.forEach(function(c){(c.visits||[]).forEach(function(v){
  out.push({d:v.date,got:Number(v.got)||0,amt:Number(v.amt)||0,name:c.name,place:v.place||c.address||""});});});return out;}

function gcalLink(c){
  if(!c||!c.date||!c.time)return "";

  var en=new Date(st.getTime()+((Number(c.duration)||30)*60000));
  function z(d){return d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");}
  var u="https://calendar.google.com/calendar/render?action=TEMPLATE";
  u+="&text="+encodeURIComponent((S.settings.bizName||"Meeting")+" \u2014 "+(c.name||""));
  u+="&dates="+z(st)+"/"+z(en);
  if(c.address)u+="&location="+encodeURIComponent(c.address);
  u+="&details="+encodeURIComponent(t("calWith")+(c.name||"")+"\n"+rescheduleLink(c));
  return u;}

function centroid(arr){var la=0,ln=0,n=0;arr.forEach(function(c){if(c.lat!=null){la+=c.lat;ln+=c.lng;n++;}});return{lat:n?la/n:0,lng:n?ln/n:0};}
function cFrom(c){if(c.allowedDays&&c.allowedDays.length)return c.allowedDays.slice().sort()[0];return c.availFrom||todayStr();}
function cTo(c){if(c.allowedDays&&c.allowedDays.length){var a=c.allowedDays.slice().sort();return a[a.length-1];}return c.availTo||c.availFrom||todayStr();}
function dayAllowed(c,day){if(c.allowedDays&&c.allowedDays.length)return c.allowedDays.indexOf(day)>=0;return cFrom(c)<=day&&day<=cTo(c);}

/* ===== planner ===== */
function sameSpot(a,b){
  if(a.lat==null||b.lat==null)return (a.address||"")!==""&&(a.address||"")===(b.address||"");
  return haversineKm(a,b)<=0.5;}
function overlaps(a,b){var as=toMin(a.time),ae=as+(Number(a.duration)||30);
  var bs=toMin(b.time),be=bs+(Number(b.duration)||30);return as<be&&bs<ae;}
function mergeConcurrent(list){
  var used={},out=[];
  list.forEach(function(c){
    if(used[c.id])return;
    used[c.id]=1;
    if(!c.time){out.push(c);return;}
    var grp=[c];
    list.forEach(function(o){
      if(used[o.id]||!o.time)return;
      if(sameSpot(c,o)&&grp.some(function(g){return overlaps(g,o);})){grp.push(o);used[o.id]=1;}});
    if(grp.length===1){out.push(c);return;}
    var st=Math.min.apply(null,grp.map(function(g){return toMin(g.time);}));
    var en=Math.max.apply(null,grp.map(function(g){return toMin(g.time)+(Number(g.duration)||30);}));
    out.push(Object.assign({},c,{time:toHHMM(st),duration:en-st,group:grp,
      amount:grp.reduce(function(a,g){return a+(Number(g.amount)||0);},0),
      name:grp.map(function(g){return g.name;}).filter(Boolean).join(", ")}));});
  return out;}
function planDay(list,home,speedKmh,live,now){list=mergeConcurrent(list);var speed=speedKmh||26;function travel(a,b){if(!a||!b||a.lat==null||b.lat==null)return null;var km=haversineKm(a,b)*1.4;return{km:km,min:km/speed*60};}
  var withTime=list.filter(function(c){return c.time;}).sort(function(a,b){return toMin(a.time)-toMin(b.time);});var noTime=list.filter(function(c){return!c.time;});var order=withTime.concat(noTime);
  var firstFixed=withTime[0];var homeToFirst=order.length?travel(home,order[0]):null;var cursor=(firstFixed&&order[0]===firstFixed&&homeToFirst)?toMin(firstFixed.time)-homeToFirst.min:9*60;var leaveHome=cursor;
  var prev=home,totalKm=0,totalTravel=0,bumped=false,prevFixed=null;var anyDone=order.some(function(c){return live[c.id]&&live[c.id].doneAt!=null;});
  var rows=order.map(function(c){var seg=travel(prev,c),dur=Number(c.duration)||30;var doneAt=(live[c.id]&&live[c.id].doneAt!=null)?live[c.id].doneAt:null;var buffer=null;if(c.time&&prevFixed&&seg)buffer=toMin(c.time)-(toMin(prevFixed.time)+(Number(prevFixed.duration)||30)+seg.min);
    if(doneAt!=null){cursor=doneAt;if(seg){totalKm+=seg.km;totalTravel+=seg.min;}prev=(c.lat!=null)?c:prev;if(c.time)prevFixed=c;return{c:c,seg:seg,done:true,depart:doneAt,arrive:doneAt,start:doneAt,late:0,dur:dur,buffer:buffer};}
    if(anyDone&&!bumped&&now!=null&&now>cursor){cursor=now;bumped=true;}var arrive=seg?cursor+seg.min:cursor,start=arrive,late=0;if(c.time){var f=toMin(c.time);if(arrive>f+1){late=arrive-f;start=arrive;}else start=f;}var depart=start+dur;cursor=depart;if(seg){totalKm+=seg.km;totalTravel+=seg.min;}prev=(c.lat!=null)?c:prev;if(c.time)prevFixed=c;
    return{c:c,seg:seg,done:false,arrive:arrive,start:start,depart:depart,late:late,dur:dur,buffer:buffer};});
  return{rows:rows,order:order,leaveHome:leaveHome,totalKm:totalKm,totalTravel:totalTravel,hasFixed:!!firstFixed,anyDone:anyDone};}

function autoPlan(){var maxPer=Number(S.settings.maxPerDay)||4;var flexAll=S.customers.filter(function(c){return c.flex;});var withCo=flexAll.filter(function(c){return c.lat!=null;});var noCo=flexAll.filter(function(c){return c.lat==null;});
  var dayLoad={};S.customers.forEach(function(c){if(!c.flex&&c.date)dayLoad[c.date]=(dayLoad[c.date]||0)+1;});
  var pool=withCo.slice(),clusters=[];
  while(pool.length){pool.sort(function(a,b){var ta=cTo(a),tb=cTo(b);if(ta!==tb)return ta<tb?-1:1;return (new Date(cTo(a))-new Date(cFrom(a)))-(new Date(cTo(b))-new Date(cFrom(b)));});
    var seed=pool.shift();var cl={members:[seed],from:cFrom(seed),to:cTo(seed)};
    while(cl.members.length<maxPer){var cands=pool.filter(function(c){return cFrom(c)<=cl.to&&cTo(c)>=cl.from;});if(!cands.length)break;var cen=centroid(cl.members);cands.sort(function(a,b){return haversineKm(cen,a)-haversineKm(cen,b);});var nx=cands[0];cl.members.push(nx);cl.from=cl.from>cFrom(nx)?cl.from:cFrom(nx);cl.to=cl.to<cTo(nx)?cl.to:cTo(nx);pool=pool.filter(function(c){return c!==nx;});}
    clusters.push(cl);}
  clusters.sort(function(a,b){return a.to<b.to?-1:a.to>b.to?1:0;});
  clusters.forEach(function(cl){var day=null,d=cl.from,guard=0;while(d<=cl.to&&guard<400){guard++;var okAll=cl.members.every(function(m){return dayAllowed(m,d);});if(okAll&&(dayLoad[d]||0)+cl.members.length<=maxPer){day=d;break;}d=nextDay(d);}if(!day){day=cl.from;cl.over=true;}cl.day=day;dayLoad[day]=(dayLoad[day]||0)+cl.members.length;});
  noCo.forEach(function(c){var best=null,d=cFrom(c),to=cTo(c),guard=0;while(d<=to&&guard<400){guard++;if(dayAllowed(c,d)&&(dayLoad[d]||0)<maxPer&&(best===null||(dayLoad[d]||0)<(dayLoad[best]||0)))best=d;d=nextDay(d);}if(best===null)best=cFrom(c);dayLoad[best]=(dayLoad[best]||0)+1;clusters.push({members:[c],day:best,from:cFrom(c),to:cTo(c),noCo:true});});
  return{clusters:clusters,maxPer:maxPer};}
function clusterKm(home,stops){var pts=stops.filter(function(c){return c.lat!=null;});if(!pts.length)return 0;var pool=pts.slice(),order=[],cur;if(home){cur=home;}else{cur=pool.shift();order.push(cur);}while(pool.length){pool.sort(function(a,b){return haversineKm(cur,a)-haversineKm(cur,b);});var n=pool.shift();order.push(n);cur=n;}var km=0,prev=home?home:order[0],seq=home?order:order.slice(1);seq.forEach(function(c){km+=haversineKm(prev,c)*1.4;prev=c;});return km;}

function leadId(){
  var k="";try{k=localStorage.getItem("lb_lead")||"";}catch(x){}
  if(!k){k="L"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{localStorage.setItem("lb_lead",k);}catch(x){}}
  return k;}
var LEADT=null;
function saveLead(done){
  if(!API)return;
  clearTimeout(LEADT);
  var go=function(){
    fetch(API,{method:"POST",body:JSON.stringify({action:"lead",leadId:leadId(),
      mode:BOOK.mode||"",name:BOOK.name||"",mobile:BOOK.phone||"",bank:BOOK.bank||"",
      due:BOOK.due||"",amount:Number(BOOK.amount)||0,card:BOOK.card||"",
      place:(getLoc("opt").label||getLoc("opt").raw||""),
      date:BOOK._od||"",time:BOOK._ot||"",submitted:!!done})}).catch(function(){});};
  if(done)go();else LEADT=setTimeout(go,3000);}

    S.tab="upcoming";render();alert(t("alCancelled"));return;}
var o=(b.options||[])[BSEL[id]||0];if(!o){alert(t("alPickOption"));return;}
  var isChg=(b.type==="change"&&b.cid&&S.customers.some(function(x){return x.id===b.cid;}));
  var lim=Number(S.settings.dayLimit)||0, amt=Number(b.amt)||0;
  if(lim>0&&amt>0){var tot=dayAmount(o.date,isChg?b.cid:null)+amt;
    if(tot>lim&&!confirm(t("overLimit")+inr(tot)+t("overLimit2")+inr(lim)+t("overAsk")))return;}
  var who=isChg?updateSlot(b.cid,o):addConfirmed(b.n,b.p,b.notes,o,b.e,b.org,b);
  if(who){if(!who.email&&b.e)who.email=b.e;notifyClient(who,isChg?"move":"new");
    logToSheet(who,isChg?"rescheduled":"confirmed");}
  var sent=openWa(who);
  if(S.settings.apiUrl)fetch(S.settings.apiUrl,{method:"POST",body:JSON.stringify({action:"accept",key:ownerKey(),id:id})}).catch(function(){});
  PENDING=PENDING.filter(function(x){return x.id!==id;});
  S.tab="upcoming";render();
  if(!sent)alert(t("waNoPhone"));};
window.skipBooking=function(id){if(S.settings.apiUrl)fetch(S.settings.apiUrl,{method:"POST",body:JSON.stringify({action:"accept",key:ownerKey(),id:id})}).catch(function(){});PENDING=PENDING.filter(function(x){return x.id!==id;});render();};

/* ===== screenshot OCR ===== */
function fmtYMD(d){return ymd(d);}
function extractDate(text,ref){var x=(text||"").toLowerCase();var base=new Date(ref.getFullYear(),ref.getMonth(),ref.getDate());function plus(n){var d=new Date(base);d.setDate(d.getDate()+n);return fmtYMD(d);}var m;
  if((m=x.match(/after\s*(\d{1,2})\s*days?/))||(m=x.match(/(\d{1,2})\s*din\s*(?:baad|bad|me|mein)/)))return plus(parseInt(m[1],10));
  if(/\b(parso|parson|day after tomorrow)\b/.test(x))return plus(2);
  if(/\b(kal|tomorrow|tmrw|tmr)\b/.test(x))return plus(1);
  if(/\b(aaj|today)\b/.test(x))return plus(0);
  var mon=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  if((m=x.match(/(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/))){var day=parseInt(m[1],10),mi=mon.indexOf(m[2]),y=base.getFullYear(),d=new Date(y,mi,day);if(d<new Date(base.getFullYear(),base.getMonth(),base.getDate()-1))d=new Date(y+1,mi,day);return fmtYMD(d);}
  if((m=x.match(/(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?/))){var dd=parseInt(m[1],10),mm=parseInt(m[2],10)-1,yy=m[3]?parseInt(m[3],10):base.getFullYear();if(yy<100)yy+=2000;if(mm>=0&&mm<12&&dd>=1&&dd<=31)return fmtYMD(new Date(yy,mm,dd));}
  var wd=["sun","mon","tue","wed","thu","fri","sat"];for(var i=0;i<7;i++){if(new RegExp("\\b"+wd[i]).test(x)){var d2=new Date(base);var add=((i-d2.getDay())+7)%7;if(add===0)add=7;d2.setDate(d2.getDate()+add);return fmtYMD(d2);}}
  return "";}
function loadTesseract(cb){if(window.Tesseract){cb();return;}var st=document.getElementById("ocrStatus");if(st)st.textContent=t("ocrEngine");var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";s.onload=function(){cb();};s.onerror=function(){if(st){st.style.color="var(--danger)";st.textContent=t("ocrLoadFail");}};document.head.appendChild(s);}
window.ocrScreenshot=function(input){var f=input.files&&input.files[0];if(!f)return;var ref=new Date(f.lastModified||Date.now());var st=document.getElementById("ocrStatus");if(st){st.style.color="var(--sub)";st.textContent=t("ocrReading");}
  loadTesseract(function(){var url=URL.createObjectURL(f);
    window.Tesseract.recognize(url,"eng",{logger:function(mm){if(mm&&mm.status==="recognizing text"&&mm.progress!=null){var e=document.getElementById("ocrStatus");if(e)e.textContent=t("ocrReadingP")+Math.round(mm.progress*100)+"%";}}}).then(function(res){parseOcr((res&&res.data&&res.data.text)||"",ref);}).catch(function(){var e=document.getElementById("ocrStatus");if(e){e.style.color="var(--danger)";e.textContent=t("ocrFail");}});});};
function parseOcr(text,ref){var ph=(text.match(/(?:\+?91[\s\-]?)?[6-9]\d{9}/)||[])[0];if(ph)D.phone=ph.replace(/\D/g,"").slice(-10);
  var dt=extractDate(text,ref);if(dt)D.date=dt;
  var lines=(text||"").split("\n").map(function(s){return s.trim();}).filter(Boolean);
  for(var i=0;i<lines.length;i++){var L=lines[i];if(/^[A-Za-z][A-Za-z .]{1,28}$/.test(L)&&!/(today|tomorrow|kal|aaj|parso|meet|hello|hi|thanks|thank|okay|ok|yes|online)/i.test(L)){if(!D.name)D.name=L;break;}}
  var got=[];if(D.phone)got.push(t("ocrPhone")+D.phone);if(dt)got.push(t("ocrDate")+fmtDate(dt));if(D.name)got.push(t("ocrName")+D.name);
  OCRMSG=got.length?(t("ocrGot")+got.join(", ")+t("ocrCheck")):t("ocrNothing");
  render();var el=document.getElementById("ocrStatus");if(el){el.style.color=got.length?"var(--teal)":"var(--sub)";el.textContent=OCRMSG;}}

/* ===== registration ===== */
function renderRegister(){var biz=esc(S.settings.bizName)||t("regBizDefault");
  return langToggle()+'<div class="header"><div class="logo">\uD83D\uDC4B</div><div><h1>'+biz+'</h1><div class="sm muted">'+esc(t("regSub"))+'</div></div></div><div class="px">'
    +'<div class="banner green">'+esc(t("regIntro"))+'</div>'
    +field(t("regName"),'<input placeholder="'+esc(t("namePlace"))+'" value="'+esc(REG.name||"")+'" oninput="REG.name=this.value">')
    +field(t("regMobile"),'<input inputmode="tel" placeholder="e.g. 9876543210" value="'+esc(REG.mobile||"")+'" oninput="REG.mobile=this.value">')
    +field(t("regEmail"),'<input inputmode="email" placeholder="e.g. name@email.com" value="'+esc(REG.email||"")+'" oninput="REG.email=this.value">')
    +'<button class="btnbig" style="background:var(--teal)" onclick="doRegister()">'+esc(t("regStart"))+'</button>'
    +'<button class="undobtn" style="margin-top:10px" onclick="skipRegister()">'+esc(t("regSkip"))+'</button>'
    +'<div class="xs muted" style="margin-top:8px">'+esc(t("regConsent"))+'</div></div>';}
window.skipRegister=function(){try{localStorage.setItem("planner_reg_skip",String(Date.now()));}catch(x){}SHOW_GATE=false;render();};
window.forceGate=function(){SHOW_GATE=true;render();};
window.doRegister=function(){var m=digits(REG.mobile||""),e=(REG.email||"").trim();
  if(m.length<7){alert(t("alMobileValid"));return;}
  if(e.indexOf("@")<1||e.indexOf(".")<0){alert(t("alEmailValid"));return;}
  try{localStorage.setItem("planner_registered","1");localStorage.setItem("planner_reg",JSON.stringify({name:REG.name||"",mobile:m,email:e}));localStorage.setItem("planner_reg_pending","1");}catch(x){}
  REGISTERED=true;sendRegister();render();};
function sendRegister(){if(!REGISTER_API)return;var r;try{r=JSON.parse(localStorage.getItem("planner_reg")||"{}");}catch(x){r={};}
  fetch(REGISTER_API,{method:"POST",body:JSON.stringify({action:"register",name:r.name||"",mobile:r.mobile||"",email:r.email||""})}).then(function(){try{localStorage.removeItem("planner_reg_pending");}catch(x){}}).catch(function(){});}

/* live refresh */
setInterval(function(){if(MODE==="owner"&&S.tab==="plan"&&S.planDate===todayStr())render();},30000);

/* ===== boot ===== */
function boot(){load();var params=new URLSearchParams(location.search);
  OPENS=bumpOpens();LANGASK=langDue(OPENS);
  var userPicked=false;try{userPicked=(localStorage.getItem("lb_lang_user")==="1");}catch(x){}
  if(!S.settings.line){try{var st=localStorage.getItem("lb_line");if(st)S.settings.line=st;}catch(x){}}
  if(params.get("line"))S.settings.line=params.get("line");
  applyLine();
  try{REGISTERED=(localStorage.getItem("planner_registered")==="1");}catch(x){REGISTERED=true;}
  if(REGISTER_API&&!REGISTERED){var sk=0;try{sk=parseInt(localStorage.getItem("planner_reg_skip")||"0",10);}catch(x){}SHOW_GATE=(!sk)||((Date.now()-sk)>3*86400000);}
  if(REGISTER_API&&(function(){try{return localStorage.getItem("planner_reg_pending")==="1";}catch(x){return false;}})())sendRegister();
  if(location.hash.indexOf("#req=")===0){MODE="import";IMPORTDATA=decodeReq(location.hash.slice(5));}
  else if(params.get("book")){MODE="book";BIZ=params.get("biz")||"";OWNERWA=params.get("wa")||"";API=params.get("api")||"";if(params.get("lang")&&!userPicked)S.settings.lang=params.get("lang");
    ASKDET=!!params.get("det");BOOK={submitted:false,options:[],step:"lang",mode:""};
    var chosen=false;try{chosen=(localStorage.getItem("lb_lang_user")==="1");}catch(x){}
    if(chosen)BOOK.step="gate";
    if(params.get("fix")){BOOK.step=chosen?"form":"lang";BOOK.mode="phone";}
    var rsv=params.get("rs");if(rsv){var ro=decodeReq(rsv);if(ro){BOOK.rs=ro;BOOK.name=ro.n||"";BOOK.phone=ro.p||"";BOOK.step="form";}}}
  else MODE="owner";
  render();if(MODE==="book"){afterBookRender();loadBusy();}
  if(MODE==="owner"&&REGISTERED&&S.settings.apiUrl)loadBookings(true);}
boot();
